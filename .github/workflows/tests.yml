name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Package builds and the CLI runs from the wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel
          python -m pip install --quiet dist/*.whl
          cd /tmp && hermes-inbox --version
          python -c "import hermes_inbox.server as s; assert (s.STATIC / 'index.html').is_file(); assert (s.STATIC / 'vendor' / 'marked.min.js').is_file()"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Theme contrast (WCAG AA, body text AAA)
        run: python tools/contrast.py
      - name: JavaScript syntax
        run: for f in hermes_inbox/static/*.js; do node --check "$f"; done
