<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1c21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inbox">
<title>Hermes Inbox</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M11.52 2.3a.53.53 0 0 1 .96 0l2.31 4.68a2.1 2.1 0 0 0 1.6 1.16l5.16.76a.53.53 0 0 1 .3.91l-3.74 3.63a2.1 2.1 0 0 0-.6 1.88l.88 5.14a.53.53 0 0 1-.78.56l-4.62-2.43a2.1 2.1 0 0 0-1.97 0L6.4 21.01a.53.53 0 0 1-.77-.56l.88-5.14a2.1 2.1 0 0 0-.61-1.88L2.16 9.8a.53.53 0 0 1 .29-.9l5.17-.76a2.1 2.1 0 0 0 1.6-1.16z"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/></symbol>
    <symbol id="i-branch" viewBox="0 0 24 24"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-checks" viewBox="0 0 24 24"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  </defs>
</svg>

<div class="app" id="app" data-pane="list">
  <nav class="sidebar" id="sidebar" aria-label="Mailboxes">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="19" rx="4"/><path d="M3 18h7l2 3h8l2-3h7"/><path d="M11 7l5-4 5 4"/></svg>
      <span>Hermes Inbox</span>
      <button class="icon-btn drawer-close only-narrow" id="btn-drawer-close" type="button" aria-label="Close menu"><svg><use href="#i-x"/></svg></button>
    </div>
    <ul class="nav" id="nav-views"></ul>
    <h2 class="nav-heading">Sources</h2>
    <ul class="nav" id="nav-sources"></ul>
    <h2 class="nav-heading">Scheduled jobs <button class="link-btn" id="jobs-toggle" type="button"></button></h2>
    <ul class="nav nav-groups" id="nav-jobs"></ul>
    <h2 class="nav-heading" id="boards-heading" hidden>Kanban boards</h2>
    <ul class="nav nav-groups" id="nav-boards"></ul>
    <div class="sidebar-foot">
      <span id="index-status" class="muted"></span>
      <div class="foot-actions">
        <button class="icon-btn" id="btn-theme" type="button" title="Switch to light theme" aria-label="Switch to light theme">
          <svg class="theme-icon-dark"><use href="#i-sun"/></svg><svg class="theme-icon-light"><use href="#i-moon"/></svg>
        </button>
        <form method="post" action="/logout"><button class="icon-btn" type="submit" title="Sign out" aria-label="Sign out"><svg><use href="#i-logout"/></svg></button></form>
      </div>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <section class="listpane" aria-label="Items">
    <header class="list-head">
      <div class="list-title-row">
        <h1 id="list-title">Inbox</h1>
        <span class="count muted" id="list-count"></span>
        <div class="spacer"></div>
        <button class="icon-btn" id="btn-reindex" type="button" title="Check for new items" aria-label="Check for new items"><svg><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="btn-markall" type="button" title="Mark all read (Shift+I)" aria-label="Mark everything here as read"><svg><use href="#i-checks"/></svg></button>
        <div class="menu-wrap">
          <button class="icon-btn" id="btn-export" type="button" title="Export this view" aria-label="Export this view" aria-haspopup="true" aria-expanded="false" aria-controls="export-menu"><svg><use href="#i-download"/></svg></button>
          <div class="menu" id="export-menu" role="menu" hidden>
            <a role="menuitem" data-fmt="json" href="#">Export as JSON</a>
            <a role="menuitem" data-fmt="csv" href="#">Export as CSV</a>
          </div>
        </div>
      </div>
      <p class="group-usage" id="group-usage" hidden></p>
      <label class="search" id="search-box">
        <svg aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Search everything" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search">
        <kbd>/</kbd>
        <button class="icon-btn search-clear" id="search-clear" type="button" aria-label="Clear search"><svg><use href="#i-x"/></svg></button>
      </label>
      <div class="filters" id="filters"></div>
    </header>
    <div class="list" id="list" role="listbox" aria-label="Items" tabindex="0"></div>
  </section>

  <main class="reader" id="reader" aria-label="Reading pane">
    <div class="reader-empty" id="reader-empty">
      <svg><use href="#i-mail"/></svg>
      <p>Pick something from the list.</p>
      <p class="muted keys"><kbd>j</kbd><kbd>k</kbd> move · <kbd>e</kbd> archive · <kbd>s</kbd> star · <kbd>b</kbd> snooze · <kbd>u</kbd> unread · <kbd>/</kbd> search</p>
    </div>
    <article class="item" id="item" hidden></article>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a class="tab" href="#/view/inbox" data-tab="inbox"><svg><use href="#i-inbox"/></svg>Inbox<span class="tab-badge" data-badge="inbox"></span></a>
    <a class="tab" href="#/view/attention" data-tab="attention"><svg><use href="#i-alert"/></svg>Attention<span class="tab-badge hot" data-badge="attention"></span></a>
    <a class="tab" href="#/source/artifact" data-tab="artifact"><svg><use href="#i-file"/></svg>Files</a>
    <a class="tab" href="#/view/starred" data-tab="starred"><svg><use href="#i-star"/></svg>Starred</a>
    <button class="tab" type="button" id="btn-menu" data-tab="more" aria-label="All mailboxes and jobs"><svg><use href="#i-menu"/></svg>More</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
